<div class="login-container">

    <div class="login-card">

        <h1>AI Smart Support Desk</h1>

        <p>
            AI Powered Support Ticket System
        </p>

        <input
            type="email"
            placeholder="Email"
            [(ngModel)]="email"
        >

        <input
            type="password"
            placeholder="Password"
            [(ngModel)]="password"
        >

        <button (click)="login()">
            Login
        </button>

    </div>

</div>
